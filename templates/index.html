{% extends "base.html" %}

{% block content %}
<div class="page">
  <h1 class="page-title">Posts</h1>
  <ul class="post-list">
    {% set posts = get_section(path="posts/_index.md") %}
    {% for post in posts.pages | sort(attribute="date") | reverse %}
    <li>
      <a href="{{ post.permalink | safe }}">
        <time datetime="{{ post.date }}">{{ post.date | date(format="%b %d, %Y") }}</time>
        <span class="post-link-title">{{ post.title }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock content %}
