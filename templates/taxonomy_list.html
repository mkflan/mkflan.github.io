{% extends "base.html" %}

{% block content %}
<div class="page">
  <h1 class="page-title">Series</h1>
  {% if terms | length %}
  <ul class="post-list">
    {% for term in terms %}
    <li>
      <a href="{{ term.permalink | safe }}">
        <span class="post-meta-count">{{ term.pages | length }} post{% if term.pages | length != 1 %}s{% endif %}</span>
        <span class="post-link-title">{{ term.name }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">No series yet.</p>
  {% endif %}
</div>
{% endblock content %}
